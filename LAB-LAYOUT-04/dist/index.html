<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card con Grid</title>
    <link rel="stylesheet" href="/styles.164d45a1.css">
<script src="/styles.164d45a1.js"></script></head>

<body>
    <div class="card">
        <img src="https://fastly.picsum.photos/id/866/400/300.jpg?hmac=JMubLT0llOloTrCSJIptm4kmT13cmWrNcdbpI9vJwmw" alt="mountain" class="card-image">

        <h2 class="card-title">Title</h2>

        <p class="card-description">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Ipsum delenit enim aliquam blanditiis quod quasi
            nesciunt. Sed natus cupiditate fuga repellendus, commodi ipsum nostrum quae, nobis veritatis amet est
            cumque.
        </p>

        <p class="card-date">
            Published: <span>March 20, 2020</span>
        </p>

        <button class="card-button">More info</button>
    </div>
</body>

</html>
